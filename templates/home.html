<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentimenAI | Next-Gen Emotion Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --primary: #0A84FF; /* iOS Blue */
            --text-main: #ffffff;
            --text-sec: #86868b;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }

        body {
            background-color: #000;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* --- AURORA BACKGROUND ANIMATION --- */
        .aurora {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1e1e24, #000);
        }
        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: move 10s infinite alternate;
        }
        .blob-1 { top: 10%; left: 20%; width: 400px; height: 400px; background: #2f27ce; border-radius: 40% 60% 70% 30%; }
        .blob-2 { bottom: 20%; right: 10%; width: 350px; height: 350px; background: #c20d9d; border-radius: 60% 40% 30% 70%; animation-delay: -5s; }
        .blob-3 { bottom: 10%; left: 30%; width: 300px; height: 300px; background: #0A84FF; border-radius: 50%; animation-duration: 15s; }

        @keyframes move {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50px, 30px) rotate(20deg); }
        }

        /* --- GLASS CARD --- */
        .glass-container {
            text-align: center;
            padding: 60px 40px;
            background: rgba(20, 20, 20, 0.4); /* Dark Glass */
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            box-shadow: var(--glass-shadow);
            max-width: 600px;
            width: 90%;
            transition: transform 0.3s;
        }
        
        .glass-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.8);
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p {
            font-size: 1.25rem;
            color: var(--text-sec);
            margin-bottom: 50px;
            font-weight: 400;
            line-height: 1.6;
        }

        .btn-ios {
            display: inline-block;
            padding: 18px 45px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);
        }

        .btn-ios:hover {
            background: #007aff;
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(10, 132, 255, 0.6);
        }
        
        /* Footer credits */
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .glass-container { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <div class="aurora">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="glass-container">
        <div class="badge">Artificial Intelligence • Kelompok 8</div>
        <h1>Emosi di Balik<br>Setiap Kata.</h1>
        <p>Teknologi AI yang membaca nuansa perasaan manusia dari teks dengan akurasi tinggi.</p>
        
        <a href="/app" class="btn-ios">Mulai Analisis</a>
        
        <div class="footer">Powered by IndoBERTweet Transformer</div>
    </div>

</body>
</html>
